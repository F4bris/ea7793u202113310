@if (store.error()) {
  <p role="alert">{{ 'my-adventure-camps.load-error' | translate }}</p>
}

<mat-grid-list cols="2" rowHeight="300px" gutterSize="16px">
  @for (occupancy of store.occupancies(); track occupancy.adventureCamps.id) {
    <mat-grid-tile>
      <app-adventure-camps-summary [occupancy]="occupancy" />
    </mat-grid-tile>
  }
</mat-grid-list>
